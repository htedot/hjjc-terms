<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环境监测 · 背术语</title>
<meta name="theme-color" content="#961e2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="背术语">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --paper:#faf7f2; --ink:#1c1c1e; --gry:#6b6b70; --line:#ddd6cb;
  --acc:#961e2d; --acc-l:#f3e3e4; --grn:#1f6b45; --grn-l:#e4efe7;
  --blu:#22507a; --blu-l:#e3ecf4; --sand:#f2ece1;
  --tabH:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,sans-serif;
  font-size:16px; line-height:1.65;
  padding:14px 14px calc(var(--tabH) + 26px + env(safe-area-inset-bottom));
  max-width:760px; margin:0 auto;
}
header{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--acc);padding-bottom:7px}
h1{font-size:19px;margin:0;letter-spacing:.4px}
h1 small{font-size:11.5px;color:var(--gry);font-weight:400;margin-left:5px;letter-spacing:0}
#stat{margin-left:auto;font-size:12px;color:var(--gry);font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:9px 0 11px}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .25s}

.ctl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:7px}
#fCh{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#fCh::-webkit-scrollbar{display:none}
.chip{
  font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--gry);cursor:pointer;user-select:none;transition:.15s;
  white-space:nowrap;flex:0 0 auto;
}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.on.grn{background:var(--grn);border-color:var(--grn)}
.sep{width:1px;background:var(--line);margin:2px 3px;flex:0 0 auto}

#stage{
  background:#fff;border:1px solid var(--line);border-radius:10px;
  padding:20px 18px;min-height:236px;display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 24px -18px rgba(0,0,0,.35);
}
.qtag{font-size:11.5px;color:var(--gry);letter-spacing:.08em;margin-bottom:9px}
.qtag b{color:var(--acc);font-weight:600}
#front{font-size:28px;font-weight:650;line-height:1.35;letter-spacing:.4px;word-break:break-word}
#front.en{font-size:25px;font-weight:600;font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px}
#sub{color:var(--gry);font-size:13px;margin-top:7px}
#answer{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);display:none}
#answer.show{display:block}
#ansMain{font-size:24px;font-weight:600;font-family:Georgia,"Times New Roman",serif;color:var(--blu);word-break:break-word}
#ansMain.zh{font-family:inherit;font-size:21px;color:var(--ink)}
#ansNote{font-size:13px;color:var(--gry);margin-top:7px}
.flag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--sand);color:#8a6a2f;margin-left:6px;vertical-align:2px;font-family:inherit;font-weight:400}

#acts{display:flex;gap:9px;margin-top:18px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:12px 8px;flex:1;transition:.15s}
button:active{transform:scale(.985)}
button.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.ok{background:var(--grn);border-color:var(--grn);color:#fff;font-weight:600}
button.no{background:#fff;border-color:#c9b7b9;color:var(--acc);font-weight:600}

#quiz{display:none;flex-direction:column;gap:8px;margin-top:14px}
.opt{
  text-align:left;padding:13px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;
  font-size:16px;font-family:Georgia,"Times New Roman",serif;line-height:1.4;flex:none;
}
.opt.right{background:var(--grn-l);border-color:var(--grn);font-weight:600}
.opt.wrong{background:var(--acc-l);border-color:var(--acc);text-decoration:line-through;opacity:.75}

#list{display:none;margin-top:2px;max-height:66vh;overflow:auto;-webkit-overflow-scrolling:touch}
#list .row,#home .row{display:grid;grid-template-columns:1fr;gap:1px;padding:7px 0;border-bottom:1px solid var(--line)}
#list .rz,#home .rz{font-size:13.5px;color:var(--ink)}
#list .re,#home .re{font-size:13px;color:var(--acc);word-break:break-word}
#list .rn,#home .rn{font-size:11.5px;color:var(--gry);line-height:1.5}
#list .flag,#home .flag{margin-left:0;margin-right:4px}
#list .lh{font-size:12px;color:var(--gry);padding:2px 0 5px}

#type{display:none;margin-top:14px}
#type input{
  width:100%;font:inherit;font-size:18px;padding:11px 12px;border:1px solid var(--line);
  border-radius:8px;background:#fff;font-family:Georgia,"Times New Roman",serif;
}
#type input:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px var(--blu-l)}
#fb{margin-top:9px;font-size:14px;min-height:21px}
#fb.good{color:var(--grn);font-weight:600}
#fb.bad{color:var(--acc);font-weight:600}
#end{display:none;text-align:center;padding:26px 8px}
#end h2{font-size:18px;margin:0 0 5px}
#end p{color:var(--gry);font-size:13.5px}

#hint{font-size:11.5px;color:var(--gry);margin-top:10px;text-align:center}
#hint kbd{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:#444}
#hint .kb{display:none}
@media (hover:hover){ #hint .kb{display:inline} }

/* ---------- 总览 ---------- */
#home{display:none}
#home .hcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
#home .hc{border:1px solid var(--line);border-radius:9px;padding:10px 8px;text-align:center;background:var(--paper)}
#home .hc b{display:block;font-size:23px;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--ink)}
#home .hc span{font-size:11.5px;color:var(--gry)}
#home .hc.acc{border-color:#e0c3c6;background:var(--acc-l)}
#home .hc.acc b{color:var(--acc)}
#home .hsec{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.06em;margin:16px 0 6px;
  padding-left:7px;border-left:3px solid var(--acc);line-height:1.2}
#home .chrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
#home .chrow:last-child{border-bottom:none}
#home .chrow .nm{font-size:13.5px;flex:1}
#home .chrow .n{font-size:12px;color:var(--gry);font-variant-numeric:tabular-nums}
#home .minibar{width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:0 0 auto}
#home .minibar i{display:block;height:100%;background:var(--grn)}
#home .qbtn{display:flex;gap:8px;flex-wrap:wrap}
#home .qbtn button{flex:1 1 30%;font-size:13.5px;padding:11px 6px;border-radius:9px}
#home details{border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--paper);overflow:hidden}
#home summary{padding:10px 12px;font-size:13.5px;cursor:pointer;list-style:none}
#home summary::-webkit-details-marker{display:none}
#home summary::before{content:"▸ ";color:var(--acc)}
#home details[open] summary::before{content:"▾ "}
#home details[open] summary{border-bottom:1px solid var(--line);background:#fff}
#home .dbody{padding:0 12px 8px;background:#fff}
#home .note{font-size:11.5px;color:var(--gry);line-height:1.6;margin-top:10px}

/* ---------- 重点栏 ---------- */
#key{display:none;margin-top:2px;max-height:66vh;overflow:auto;-webkit-overflow-scrolling:touch}
#key .kg{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.06em;margin:14px 0 4px;
  padding-left:7px;border-left:3px solid var(--acc);line-height:1.2}
#key .kg:first-child{margin-top:2px}
#key .ki{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
#key .ki .ck{flex:0 0 auto;width:17px;height:17px;margin-top:3px;border:1.5px solid var(--line);border-radius:50%;
  font-size:11px;line-height:15px;text-align:center;color:transparent}
#key .ki.done .ck{background:var(--grn);border-color:var(--grn);color:#fff}
#key .ki.done .tx{color:var(--gry);text-decoration:line-through;text-decoration-thickness:1px}
#key .ki .tx{font-size:13.5px;line-height:1.55}
#key .ki .tx em{font-style:normal;color:var(--acc);font-weight:600}
#key .ki .src{float:right;margin-left:10px;font-size:10.5px;color:#b6ada0;letter-spacing:.02em;line-height:1.55}
#key .kh{font-size:12px;color:var(--gry);padding:2px 0 4px}
#key .f{font-family:Georgia,"Times New Roman",serif;color:var(--blu);font-size:14px;word-break:break-word}

/* ---------- 底部标签栏 ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;height:calc(var(--tabH) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(250,247,242,.97);border-top:1px solid var(--line);
  display:flex;align-items:stretch;backdrop-filter:blur(8px);z-index:20;
}
.tabbar .tab{
  flex:1;border:none;background:none;border-radius:0;padding:6px 0 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;color:var(--gry);letter-spacing:.02em;
}
.tabbar .tab i{font-style:normal;font-size:15px;line-height:1;opacity:.75}
.tabbar .tab.on{color:var(--acc);font-weight:700}
.tabbar .tab.on i{opacity:1}

@media (max-width:400px){
  body{padding-left:11px;padding-right:11px}
  #front{font-size:25px} #ansMain{font-size:21px}
  #stage{padding:18px 14px;min-height:210px}
  #home .hc b{font-size:20px}
}
</style>
</head>
<body>

<header>
  <h1>环境监测 · 背术语<small>双语 120 条</small></h1>
  <div id="stat"></div>
</header>
<div class="bar"><i id="prog"></i></div>

<div id="toolbar">
  <div class="ctl" id="fCh">
    <span class="chip on" data-ch="0">全部</span>
    <span class="chip" data-ch="1">第 1 章</span>
    <span class="chip" data-ch="2">第 2 章 水</span>
    <span class="chip" data-ch="3">第 3 章 气</span>
    <span class="sep"></span>
    <span class="chip" data-f="supp">只看〔补〕</span>
    <span class="chip grn" data-f="wrong">错题本</span>
  </div>
  <div class="ctl" id="fMode">
    <span class="chip on" data-dir="zh">中 → 英</span>
    <span class="chip" data-dir="en">英 → 中</span>
    <span class="sep"></span>
    <span class="chip" id="btnShuffle">洗牌</span>
    <span class="chip" id="btnReset">清零</span>
  </div>
</div>

<div id="stage">
  <div id="home"></div>
  <div class="qtag" id="qtag"></div>
  <div id="front"></div>
  <div id="sub"></div>
  <div id="answer">
    <div id="ansMain"></div>
    <div id="ansNote"></div>
  </div>

  <div id="quiz"></div>
  <div id="list"></div>
  <div id="key"></div>

  <div id="type">
    <input id="tinput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="打出英文，回车提交">
    <div id="fb"></div>
  </div>

  <div id="acts">
    <button class="main" id="btnReveal">翻面 <span style="opacity:.7">␣</span></button>
    <button class="no" id="btnNo" style="display:none">不会 1</button>
    <button class="ok" id="btnOk" style="display:none">会了 2</button>
  </div>

  <div id="end">
    <h2>这一轮走完了</h2>
    <p id="endTxt"></p>
    <div class="ctl" style="justify-content:center;margin-top:12px">
      <span class="chip on" id="btnAgain">再来一轮</span>
    </div>
  </div>
</div>

<div id="hint">
  <span class="kb"><kbd>空格</kbd> 翻面 / 提交 &nbsp; <kbd>1</kbd> 不会 &nbsp; <kbd>2</kbd> 会了 &nbsp;</span>
  点上方标签切换模式
</div>

<nav class="tabbar">
  <button class="tab" data-m="home"><i>▤</i>总览</button>
  <button class="tab" data-m="key"><i>★</i>重点</button>
  <button class="tab" data-m="card"><i>▭</i>卡片</button>
  <button class="tab" data-m="type"><i>⌨</i>默写</button>
  <button class="tab" data-m="quiz"><i>◈</i>四选一</button>
  <button class="tab" data-m="list"><i>☰</i>速查</button>
</nav>

<script>

/* ---------- 取题 ---------- */
function pool(){
  let p = TERMS.filter(t => !state.ch || t.ch === state.ch);
  if (state.f === "supp") p = p.filter(t => t.supp);
  if (state.f === "wrong") p = p.filter(t => store.wrong[t.zh]);
  if (state.mode === "type" || state.mode === "quiz") p = p.filter(typeable);
  if (state.dir === "zh") p = p.filter(hasEn);
  return p;
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function build(shuffleIt){
  if (state.mode === "home"){ showHome(); return; }
  if (state.mode === "key"){ showKey(); return; }
  let p = pool().slice();
  if (state.mode === "list"){
    p.sort((a, b) => (a.ch - b.ch) || (TERMS.indexOf(a) - TERMS.indexOf(b)));
  } else {
    if (shuffleIt !== false) shuffle(p);
    if (state.f !== "wrong") p.sort((a, b) => (store.wrong[b.zh] ? 1 : 0) - (store.wrong[a.zh] ? 1 : 0));
  }
  state.queue = p; state.i = 0;
  if (!p.length){
    ["answer","acts","quiz","type","front","sub","qtag"].forEach(id => $(id).style.display = "none");
    $("end").style.display = "block";
    $("endTxt").textContent = "这个筛选下没有词条。换个筛选看看。";
    $("btnAgain").style.display = "none";
    updateStat();
    return;
  }
  render();
}

  $("qtag").innerHTML = `<b>第 ${t.ch} 章</b> &nbsp;${t.supp ? '<span class="flag">补</span>' : ''} &nbsp;<span style="opacity:.6">${state.i + 1} / ${state.queue.length}</span>`;
  $("front").className = askZh ? "" : "en";
  $("front").textContent = askZh ? t.zh : t.en;
  $("sub").textContent = state.mode === "card" ? (askZh ? "先在心里说出英文，再翻面" : "这是英文，想想它对应哪个中文术语") : "";
  $("answer").className = ""; $("ansMain").className = askZh ? "" : "zh";
  $("ansMain").textContent = askZh ? t.en : t.zh;
  $("ansNote").textContent = t.note || "";
  $("btnReveal").style.display = (state.mode === "quiz") ? "none" : ""; $("btnNo").style.display = "none"; $("btnOk").style.display = "none";
  $("btnReveal").textContent = "翻面 ␣";

  if (state.mode === "type") startType(t);
  if (state.mode === "quiz") startQuiz(t);
  updateStat();
}

/* ---------- 总览 ---------- */
function knownIn(ch){ return TERMS.filter(t => t.ch === ch && store.known[t.zh]).length; }
function totalIn(ch){ return TERMS.filter(t => t.ch === ch).length; }

function showHome(){
  GAME.forEach(id => $(id).style.display = "none");
  const box = $("home"); box.style.display = "block";
  const known = Object.keys(store.known).length;
  const wrong = Object.keys(store.wrong).length;
  const rest = TERMS.length - known;
  const suppN = TERMS.filter(t => t.supp).length;

  let chRows = "";
  [1,2,3].forEach(ch => {
    const tot = totalIn(ch), k = knownIn(ch), pct = Math.round(k / tot * 100);
    chRows += `<div class="chrow" data-ch="${ch}">
      <div class="nm">${CHNAME[ch]}</div>
      <div class="minibar"><i style="width:${pct}%"></i></div>
      <div class="n">${k}/${tot}</div></div>`;
  });

  let details = "";
  [1,2,3].forEach(ch => {
    const rows = TERMS.filter(t => t.ch === ch).map(t =>
      `<div class="row"><div class="rz">${t.supp ? '<span class="flag">补</span>' : ''}${esc(t.zh)}</div>` +
      `<div class="re">${esc(t.en || "—")}</div>` +
      (t.note ? `<div class="rn">${esc(t.note)}</div>` : "") + `</div>`).join("");
    details += `<details><summary>${CHNAME[ch]} · ${totalIn(ch)} 条（已掌握 ${knownIn(ch)}）</summary><div class="dbody">${rows}</div></details>`;
  });

  box.innerHTML = `
    <div class="hcards">
      <div class="hc"><b>${known}</b><span>已掌握</span></div>
      <div class="hc"><b>${rest}</b><span>还没记住</span></div>
      <div class="hc acc"><b>${wrong}</b><span>错题本</span></div>
    </div>
    <div class="hsec">按章看（点一行就开始背这一章）</div>
    ${chRows}
    <div class="hsec">现在去</div>
    <div class="qbtn">
      <button class="main" data-go="card">接着背</button>
      <button data-go="wrong">只刷错题${wrong ? "（" + wrong + "）" : ""}</button>
      <button data-go="supp">只看〔补〕${suppN}</button>
      <button data-go="key">★ 重点栏 ${keyDone()}/${keyCount()}</button>
    </div>
    <div class="hsec">全部 120 条（点开看）</div>
    ${details}
    <div class="note">考试 2026-11-17（周二）闭卷。带〔补〕的是课件没给英文原话、我按标准译法补的，答题以老师课件为准。进度只存在这台手机的浏览器里，换设备不同步。<br>想随时点开：浏览器菜单里选「添加到主屏幕」，之后就像 App 一样一按就开。</div>`;

  box.querySelectorAll(".chrow").forEach(el => el.onclick = () => {
    const ch = +el.dataset.ch;
    document.querySelectorAll("#fCh .chip").forEach(x => x.classList.remove("on"));
    document.querySelector(`#fCh .chip[data-ch="${ch}"]`).classList.add("on");
    state.ch = ch; state.f = null;
    setMode("card", true);
  });
  box.querySelectorAll("[data-go]").forEach(el => el.onclick = () => {
    const go = el.dataset.go;
    if (go === "card"){ setMode("card", true); return; }
    if (go === "key"){ setMode("key", true); return; }
    document.querySelectorAll("#fCh .chip").forEach(x => x.classList.remove("on"));
    document.querySelector(`#fCh .chip[data-f="${go}"]`).classList.add("on");
    state.f = go; state.ch = 0;
    setMode("card", true);
  });
  updateStat();
}

/* ---------- 重点栏 ---------- */
function showKey(){
  ["qtag","front","sub","answer","acts","quiz","type","list","end","home"].forEach(k => $(k).style.display = "none");
  const el = $("key"); el.style.display = "block";
  const s = store.key || {};
  let html = `<div class="kh">共 ${keyCount()} 条 · 已记 <b>${keyDone()}</b> 条（点一下划掉，记过的会存着）</div>`;
  KEY.forEach((g, gi) => {
    html += `<div class="kg">${esc(g.g)}</div>`;
    g.rows.forEach((r, ri) => {
      const k = gi + "#" + ri;
      html += `<div class="ki${s[k] ? " done" : ""}" data-k="${k}">` +
              `<div class="ck">✓</div><div class="tx"><span class="src">${esc(r[1])}</span>${r[0]}</div></div>`;
    });
  });
  el.innerHTML = html;
  el.querySelectorAll(".ki").forEach(n => n.onclick = () => {
    const k = n.dataset.k;
    store.key = store.key || {};
    if (store.key[k]) delete store.key[k]; else store.key[k] = 1;
    save(); n.classList.toggle("done", !!store.key[k]); updateStat();
  });
  updateStat();
}

/* ---------- 速查表 ---------- */
function showList(){
  $("home").style.display = "none"; $("end").style.display = "none"; $("key").style.display = "none";
  ["qtag","front","sub","answer","acts","quiz","type"].forEach(k => $(k).style.display = "none");
  const el = $("list"); el.style.display = "block";
  const rows = state.queue.map(t =>
    `<div class="row"><div class="rz">${t.supp ? '<span class="flag">补</span>' : ''}${esc(t.zh)}</div>` +
    `<div class="re">${esc(t.en || "—")}</div>` +
    (t.note ? `<div class="rn">${esc(t.note)}</div>` : "") + `</div>`).join("");
  el.innerHTML = `<div class="lh">共 ${state.queue.length} 条 · 按当前筛选</div>` + rows;
  updateStat();
}

function updateStat(){
  const known = Object.keys(store.known).length;
  const wrong = Object.keys(store.wrong).length;
  $("stat").textContent = `掌握 ${known}/${TERMS.length} · 错 ${wrong}`;
  $("prog").style.width = (known / TERMS.length * 100) + "%";
}

/* ---------- 卡片 ---------- */
function reveal(){
  state.revealed = true;
  $("answer").className = "show";
  $("btnReveal").style.display = "none";
  $("btnNo").style.display = ""; $("btnOk").style.display = "";
}
function grade(ok){
  const t = state.queue[state.i];
  if (!t) return;
  if (ok){
    store.known[t.zh] = 1;
    if (store.wrong[t.zh]) delete store.wrong[t.zh];
  } else {
    delete store.known[t.zh];
    store.wrong[t.zh] = (store.wrong[t.zh] || 0) + 1;
  }
  save(); next();
}
function next(){
  state.i++;
  render();
}
function prev(){ if (state.i > 0){ state.i--; render(); } }

/* ---------- 默写 ---------- */
function startType(t){
  state.answered = false;
  $("type").style.display = "block";
  $("answer").className = "";
  $("btnReveal").style.display = ""; $("btnReveal").textContent = "看答案 ␣";
  const inp = $("tinput"); inp.value = ""; $("fb").textContent = ""; $("fb").className = "";
  if (window.innerWidth > 600) setTimeout(() => inp.focus(), 30);
}
const norm = s => s.toLowerCase().replace(/[\s\-—–_.,;:()（）\[\]〔〕'’"“”]/g, "").replace(/μ/g, "u");
function submitType(){
  const t = state.queue[state.i];
  if (!t) return;
  const inp = $("tinput");
  if (state.answered){ next(); return; }
  const v = inp.value.trim();
  if (!v){ return; }
  const good = norm(v) === norm(t.en);
  const close = !good && (norm(t.en).includes(norm(v)) && norm(v).length >= norm(t.en).length * .8);
  $("fb").className = good ? "good" : "bad";
  $("fb").textContent = good ? "对。" : (close ? "接近了，差一点。" : "不对。");
  $("ansMain").textContent = t.en; $("ansNote").textContent = t.note || "";
  $("answer").className = "show";
  state.answered = true;
  if (good){ store.known[t.zh] = 1; delete store.wrong[t.zh]; }
  else { delete store.known[t.zh]; store.wrong[t.zh] = (store.wrong[t.zh] || 0) + 1; }
  save(); updateStat();
  $("btnReveal").style.display = "none"; $("btnNo").style.display = "none"; $("btnOk").style.display = "";
  $("btnOk").textContent = "下一条 ␣";
}

/* ---------- 四选一 ---------- */
function startQuiz(t){
  state.answered = false;
  const box = $("quiz"); box.style.display = "flex"; box.innerHTML = "";
  const others = shuffle(TERMS.filter(x => x.zh !== t.zh && typeable(x) && x.en !== t.en)).slice(0, 3).map(x => x.en);
  const opts = shuffle([t.en, ...others]);
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      if (state.answered) return;
      state.answered = true;
      const good = o === t.en;
      [...box.children].forEach(c => {
        if (c.textContent === t.en) c.classList.add("right");
        else if (c === b) c.classList.add("wrong");
      });
      if (good){ store.known[t.zh] = 1; delete store.wrong[t.zh]; }
      else { delete store.known[t.zh]; store.wrong[t.zh] = (store.wrong[t.zh] || 0) + 1; }
      save(); updateStat();
      $("ansNote").textContent = t.note || "";
      $("btnOk").style.display = ""; $("btnOk").textContent = "下一条 ␣";
    };
    box.appendChild(b);
  });
}

/* ---------- 模式切换 ---------- */
function setMode(m, rebuild){
  state.mode = m;
  document.querySelectorAll(".tabbar .tab").forEach(x => x.classList.toggle("on", x.dataset.m === m));
  const immersive = (m === "home" || m === "key");
  $("toolbar").style.display = immersive ? "none" : "";
  $("hint").style.display = (m === "card" || m === "type" || m === "quiz") ? "" : "none";
  const HINT = {
    card: '<span class="kb"><kbd>空格</kbd> 翻面 &nbsp; <kbd>1</kbd> 不会 &nbsp; <kbd>2</kbd> 会了 &nbsp;</span>点上方标签切换模式',
    type: '<span class="kb"><kbd>回车</kbd> 提交 &nbsp; <kbd>空格</kbd> 下一张 &nbsp;</span>打不出来的就点「看答案」，再选会／不会',
    quiz: '<span class="kb"><kbd>空格</kbd> 下一题 &nbsp;</span>四条里选一条，选完自动判'
  };
  if (HINT[m]) $("hint").innerHTML = HINT[m];
  if (m === "home"){ showHome(); return; }
  if (m === "key"){ showKey(); return; }
  if (m === "list"){ state.queue = pool().slice().sort((a,b) => (a.ch - b.ch) || (TERMS.indexOf(a) - TERMS.indexOf(b))); showList(); return; }
  build(rebuild !== false);
}

/* ---------- 事件 ---------- */
$("btnReveal").onclick = () => {
  if (state.mode === "type"){
    const t = state.queue[state.i]; if (!t) return;
    $("ansMain").textContent = t.en; $("ansNote").textContent = t.note || "";
    $("answer").className = "show"; state.answered = true;
    delete store.known[t.zh]; store.wrong[t.zh] = (store.wrong[t.zh] || 0) + 1; save(); updateStat();
    $("btnReveal").style.display = "none"; $("btnOk").style.display = ""; $("btnOk").textContent = "下一条 ␣";
    return;
  }
  reveal();
};
$("btnNo").onclick = () => grade(false);
$("btnOk").onclick = () => {
  if (state.mode === "type" || state.mode === "quiz"){ next(); return; }
  grade(true);
};

document.addEventListener("keydown", e => {
  if (state.mode === "home" || state.mode === "list") return;
  const typing = document.activeElement && document.activeElement.id === "tinput";
  if (typing){
    if (e.key === "Enter"){ e.preventDefault(); submitType(); }
    return;
  }
  if (e.key === " " || e.key === "Enter"){
    e.preventDefault();
    if (state.mode === "card"){ state.revealed ? next() : reveal(); }
    else if (state.mode === "type"){ state.answered ? next() : submitType(); }
    else { if (state.answered) next(); }
    return;
  }
  if (e.key === "1"){ e.preventDefault(); if (state.mode === "card" && state.revealed) grade(false); }
  if (e.key === "2"){ e.preventDefault(); if (state.mode === "card" && state.revealed) grade(true); }
  if (e.key === "ArrowLeft"){ e.preventDefault(); prev(); }
});

document.querySelectorAll("#fCh .chip").forEach(c => c.onclick = () => {
  document.querySelectorAll("#fCh .chip").forEach(x => x.classList.remove("on"));
  c.classList.add("on");
  if (c.dataset.ch !== undefined){ state.ch = +c.dataset.ch; state.f = null; }
  else { state.f = c.dataset.f; }
  if (state.mode === "home") setMode("card", true); else build();
});
document.querySelectorAll("#fMode .chip[data-dir]").forEach(c => c.onclick = () => {
  document.querySelectorAll("#fMode .chip[data-dir]").forEach(x => x.classList.remove("on"));
  c.classList.add("on"); state.dir = c.dataset.dir; build();
});
document.querySelectorAll(".tabbar .tab").forEach(t => t.onclick = () => setMode(t.dataset.m, true));
$("btnShuffle").onclick = () => build();
$("btnReset").onclick = () => {
  if (!confirm("清空掌握记录和错题本？")) return;
  store.known = {}; store.wrong = {}; save(); build();
};
$("btnAgain").onclick = () => { $("btnAgain").style.display = ""; build(); };

document.querySelectorAll("#fMode .chip[data-dir]")[0].classList.add("on");
setMode("home", false);
</script>
</body>
</html>
